version: '3.8'

services:
  app:
    build: .
    container_name: saas_app
    ports:
      - '3001:3000'
    env_file:
      - .env
    depends_on:
      - postgres
      - mongo
      - redis
    networks:
      - saas_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: saas_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas_network
    restart: unless-stopped

  mongo:
    image: mongo:6-jammy
    container_name: saas_mongo
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - saas_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    ports:
      - '6379:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - saas_network
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  saas_network:
    driver: bridge